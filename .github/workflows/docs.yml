name: Build Documentation
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  id-token: none
jobs:
  doc:
    name: Build Documentation
    runs-on: ubuntu-latest
    env:
      PARALLEL: -j2
      TOX_COLORED: 'yes'
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG source: checkout context"
        printf 'GERALT_DBG event_name=%s\n' "$GITHUB_EVENT_NAME"
        printf 'GERALT_DBG ref=%s\n' "$GITHUB_REF"
        printf 'GERALT_DBG sha=%s\n' "$GITHUB_SHA"
        printf 'GERALT_DBG repository=%s\n' "$GITHUB_REPOSITORY"
        printf 'GERALT_DBG head_ref=%s\n' "${GITHUB_HEAD_REF:-}"
        printf 'GERALT_DBG base_ref=%s\n' "${GITHUB_BASE_REF:-}"
      continue-on-error: true
    - uses: actions/checkout@v6.0.3
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: pip
    - name: Set environment for self-hosted
      if: runner.environment == 'self-hosted'
      run: |
        echo "PARALLEL=-j8" >> $GITHUB_ENV
    - uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05
      if: runner.environment != 'self-hosted'
      with:
        packages: libosmesa6-dev libgl1-mesa-dev python3-tk pandoc git-restore-mtime
        version: 3.0
    - name: Install tox-uv
      run: pip install tox-uv
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG sink: Build Documentation (tox run -e docs-build)"
        printf 'GERALT_DBG cwd=%s\n' "$(pwd)"
        printf 'GERALT_DBG GITHUB_REF=%s\n' "$GITHUB_REF"
        printf 'GERALT_DBG runner_env=%s\n' "${RUNNER_ENVIRONMENT:-unknown}"
        if [ -f tox.ini ]; then
          echo "GERALT_DBG tox.ini present"
          grep -n "docs-build" tox.ini 2>/dev/null || true
        gelse
          echo "GERALT_DBG tox.ini missing"
        fi
        if [ -f pyproject.toml ]; then
          echo "GERALT_DBG pyproject.toml present"
          grep -n "setuptools.dynamic" pyproject.toml 2>/dev/null || true
        else
          echo "GERALT_DBG pyproject.toml missing"
        fi
        if [ -d doc ]; then
          echo "GERALT_DBG doc/ present"
          ls -l doc/conf.py doc/source/make_tables.py doc/source/make_external_gallery.py 2>/dev/null || echo "GERALT_DBG doc scripts listing failed"
        else
          echo "GERALT_DBG doc/ missing"
        fi
      continue-on-error: true
    - name: Build Documentation
      run: timeout 3600 tox run -e docs-build
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 0 0 1 * *
  push:
    tags:
    - '*'
    branches:
    - main
